<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>OpenParlor</title>
  <link rel="stylesheet" href="/shared/style.css">
  <style>
    main { max-width: 760px; margin: 0 auto; padding: 8vh 20px 40px; }
    h1 { font-size: clamp(2.8rem, 11vw, 5.5rem); }
    h1 span { display: block; color: var(--tomato); }
    .lead { margin: 18px 0 36px; font-size: 1.2rem; color: var(--soft); max-width: 30em; }
    .choices { display: grid; gap: 18px; }
    .choice { padding: 22px 24px; text-align: left; display: block; width: 100%; text-decoration: none; color: inherit; font: inherit; cursor: pointer; }
    .choice:active { transform: translate(3px, 3px); box-shadow: 2px 2px 0 var(--ink); }
    .choice h2 { font-size: 1.6rem; }
    .choice p { color: var(--soft); margin-top: 6px; }
    .choice.a { background: var(--mustard); }
    .choice.a, .choice.a p { color: #1d1a17; }
    .tilt { transform: rotate(-0.6deg); }
    .foot { margin-top: 34px; color: var(--soft); font-size: 0.95rem; }
  </style>
</head>
<body>
  <main>
    <h1 id="brand"><span>OpenParlor</span></h1>
    <p class="lead" data-i18n="home.lead">Put the game on the big screen, then everyone joins from their own phone. No sign-ups, no internet needed.</p>
    <div class="choices">
      <button class="card choice a tilt" id="host">
        <h2 data-i18n="home.host.title">Put it on the big screen</h2>
        <p data-i18n="home.host.text">Open this page on the TV or laptop and start a new room.</p>
      </button>
      <a class="card choice" href="/play">
        <h2 data-i18n="home.join.title">Join from this phone</h2>
        <p data-i18n="home.join.text">Type the four-letter code you can see on the TV.</p>
      </a>
      <a class="card choice" href="/solo">
        <h2 data-i18n="home.solo.title">Practice on your own</h2>
        <p data-i18n="home.solo.text">Solo spelling, math, logic, and memory practice with saved streaks.</p>
      </a>
    </div>
    <p class="foot" id="addr"></p>
  </main>
  <script type="module" src="/home.js"></script>
</body>
</html>
